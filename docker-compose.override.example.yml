# Temporary host access to the databases and the RabbitMQ management UI for
# local debugging (DBeaver, psql). Copy to docker-compose.override.yml, which
# is git-ignored and loaded automatically by `docker compose`. Ports bind to
# 127.0.0.1 only.
services:
  identity_db:
    ports: ["127.0.0.1:5441:5432"]
  institutions_db:
    ports: ["127.0.0.1:5442:5432"]
  grades_ingest_db:
    ports: ["127.0.0.1:5443:5432"]
  grades_query_db:
    ports: ["127.0.0.1:5444:5432"]
  reviews_db:
    ports: ["127.0.0.1:5445:5432"]
  notifications_db:
    ports: ["127.0.0.1:5446:5432"]
  rabbitmq:
    ports: ["127.0.0.1:15672:15672"]
