# ClearSky: seven services behind one entry point (docs/roadmap.md, phase 3).
#
#   browser ─ proxy (Caddy, HTTPS) ─┬─ frontend
#                                   ├─ /api/*         → orchestrator (gateway)
#                                   └─ /auth/google/* → identity
#   orchestrator ─ RabbitMQ ─ identity, institutions, grades_ingest,
#                             grades_query, reviews, notifications
#
# Each service owns its Postgres database; no database, broker or service
# publishes a host port. Only the proxy is public; Mailpit and Jaeger listen
# on 127.0.0.1 for local use. See docker-compose.override.example.yml for
# temporary database access.

x-amqp-url: &amqp-url amqp://${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER must be set}:${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS must be set}@rabbitmq:5672/

# Environment every Go service shares. OTEL_EXPORTER_OTLP_ENDPOINT= (empty)
# in .env turns tracing off.
x-service-env: &service-env
  AMQP_URL: *amqp-url
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-http://otel-collector:4318}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-service: &service
  restart: unless-stopped
  networks: [clearsky]
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
    interval: 10s
    timeout: 3s
    start_period: 20s
    retries: 3

x-postgres: &postgres
  image: postgres:17.11
  restart: unless-stopped
  networks: [clearsky]
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    interval: 5s
    timeout: 3s
    retries: 10

x-needs-broker: &needs-broker
  rabbitmq:
    condition: service_healthy

services:

  # ─── Entry point ──────────────────────────────────────────────────────────
  proxy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend, orchestrator, identity]
    networks: [clearsky]

  frontend:
    <<: *service
    build: ./front-end
    environment:
      GO_API_URL: http://orchestrator:8080
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health/live"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  orchestrator:
    <<: *service
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    environment:
      <<: *service-env
      GIN_MODE: release
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ISSUER: ${JWT_ISSUER:-clearsky-identity}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-clearsky-api}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-proxy}
      RABBITMQ_MAX_IN_FLIGHT: ${RABBITMQ_MAX_IN_FLIGHT:-64}
      RABBITMQ_REQUEST_TIMEOUT: ${RABBITMQ_REQUEST_TIMEOUT:-10s}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-60}
      AUTH_RATE_LIMIT_BURST: ${AUTH_RATE_LIMIT_BURST:-20}
    depends_on: *needs-broker

  # ─── Services and their databases ─────────────────────────────────────────
  identity:
    <<: *service
    build:
      context: .
      dockerfile: identity_service/Dockerfile
    environment:
      <<: *service-env
      DATABASE_URL: postgres://identity:${IDENTITY_DB_PASSWORD}@identity_db:5432/identity?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ISSUER: ${JWT_ISSUER:-clearsky-identity}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-clearsky-api}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://localhost}
      FRONTEND_URL: ${PUBLIC_APP_URL:-https://localhost}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${PUBLIC_APP_URL:-https://localhost}/auth/google/callback
      GOOGLE_ALLOWED_DOMAINS: ${GOOGLE_ALLOWED_DOMAINS:-}
      GOOGLE_REQUIRE_WORKSPACE: ${GOOGLE_REQUIRE_WORKSPACE:-true}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_INSTITUTION: ${BOOTSTRAP_INSTITUTION:-}
    depends_on:
      <<: *needs-broker
      identity_db:
        condition: service_healthy

  identity_db:
    <<: *postgres
    environment:
      POSTGRES_USER: identity
      POSTGRES_DB: identity
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD must be set}
    volumes: [identity_db:/var/lib/postgresql/data]

  institutions:
    <<: *service
    build:
      context: .
      dockerfile: institutions_service/Dockerfile
    environment:
      <<: *service-env
      DATABASE_URL: postgres://institutions:${INSTITUTIONS_DB_PASSWORD}@institutions_db:5432/institutions?sslmode=disable
    depends_on:
      <<: *needs-broker
      institutions_db:
        condition: service_healthy

  institutions_db:
    <<: *postgres
    environment:
      POSTGRES_USER: institutions
      POSTGRES_DB: institutions
      POSTGRES_PASSWORD: ${INSTITUTIONS_DB_PASSWORD:?INSTITUTIONS_DB_PASSWORD must be set}
    volumes: [institutions_db:/var/lib/postgresql/data]

  # Write side of grades: uploads, previews, the grading state machine.
  grades_ingest:
    <<: *service
    build:
      context: .
      dockerfile: grades_ingest_service/Dockerfile
    environment:
      <<: *service-env
      DATABASE_URL: postgres://grades_ingest:${GRADES_INGEST_DB_PASSWORD}@grades_ingest_db:5432/grades_ingest?sslmode=disable
    depends_on:
      <<: *needs-broker
      grades_ingest_db:
        condition: service_healthy

  grades_ingest_db:
    <<: *postgres
    environment:
      POSTGRES_USER: grades_ingest
      POSTGRES_DB: grades_ingest
      POSTGRES_PASSWORD: ${GRADES_INGEST_DB_PASSWORD:?GRADES_INGEST_DB_PASSWORD must be set}
    volumes: [grades_ingest_db:/var/lib/postgresql/data]

  # Read side of grades: personal grades and statistics, kept in sync from
  # grades_ingest through the orchestrator (and reconciled periodically).
  grades_query:
    <<: *service
    build:
      context: .
      dockerfile: grades_query_service/Dockerfile
    environment:
      <<: *service-env
      DATABASE_URL: postgres://grades_query:${GRADES_QUERY_DB_PASSWORD}@grades_query_db:5432/grades_query?sslmode=disable
      RECONCILE_INTERVAL: ${RECONCILE_INTERVAL:-5m}
    depends_on:
      <<: *needs-broker
      grades_query_db:
        condition: service_healthy

  grades_query_db:
    <<: *postgres
    environment:
      POSTGRES_USER: grades_query
      POSTGRES_DB: grades_query
      POSTGRES_PASSWORD: ${GRADES_QUERY_DB_PASSWORD:?GRADES_QUERY_DB_PASSWORD must be set}
    volumes: [grades_query_db:/var/lib/postgresql/data]

  reviews:
    <<: *service
    build:
      context: .
      dockerfile: reviews_service/Dockerfile
    environment:
      <<: *service-env
      DATABASE_URL: postgres://reviews:${REVIEWS_DB_PASSWORD}@reviews_db:5432/reviews?sslmode=disable
      RECONCILE_INTERVAL: ${RECONCILE_INTERVAL:-5m}
    depends_on:
      <<: *needs-broker
      reviews_db:
        condition: service_healthy

  reviews_db:
    <<: *postgres
    environment:
      POSTGRES_USER: reviews
      POSTGRES_DB: reviews
      POSTGRES_PASSWORD: ${REVIEWS_DB_PASSWORD:?REVIEWS_DB_PASSWORD must be set}
    volumes: [reviews_db:/var/lib/postgresql/data]

  # Account emails (outbox, retries, hourly budget). Defaults deliver to
  # Mailpit; set SMTP_* for a real relay.
  notifications:
    <<: *service
    build:
      context: .
      dockerfile: notifications_service/Dockerfile
    environment:
      <<: *service-env
      DATABASE_URL: postgres://notifications:${NOTIFICATIONS_DB_PASSWORD}@notifications_db:5432/notifications?sslmode=disable
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-ClearSky <no-reply@clearsky.local>}
      EMAIL_HOURLY_LIMIT: ${EMAIL_HOURLY_LIMIT:-500}
    depends_on:
      <<: *needs-broker
      notifications_db:
        condition: service_healthy

  notifications_db:
    <<: *postgres
    environment:
      POSTGRES_USER: notifications
      POSTGRES_DB: notifications
      POSTGRES_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:?NOTIFICATIONS_DB_PASSWORD must be set}
    volumes: [notifications_db:/var/lib/postgresql/data]

  # ─── Infrastructure ───────────────────────────────────────────────────────
  # Shared broker (a single point of failure for now; see the roadmap).
  rabbitmq:
    image: rabbitmq:3.13.7-management
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER must be set}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS must be set}
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 5
    networks: [clearsky]

  # Daily pg_dump of the source-of-truth databases into the backups volume,
  # newest BACKUP_KEEP kept (roadmap 3.1). grades_query is rebuilt by
  # reconcile instead. Restore test: docker compose exec backup sh /scripts/restore-check.sh
  backup:
    image: postgres:17.11
    restart: unless-stopped
    entrypoint: ["sh", "/scripts/backup.sh"]
    environment:
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      INSTITUTIONS_DB_PASSWORD: ${INSTITUTIONS_DB_PASSWORD}
      GRADES_INGEST_DB_PASSWORD: ${GRADES_INGEST_DB_PASSWORD}
      REVIEWS_DB_PASSWORD: ${REVIEWS_DB_PASSWORD}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - ./deploy/backup:/scripts:ro
      - backups:/backups
    depends_on:
      identity_db: { condition: service_healthy }
      institutions_db: { condition: service_healthy }
      grades_ingest_db: { condition: service_healthy }
      reviews_db: { condition: service_healthy }
    networks: [clearsky]

  # Development mail catcher: http://127.0.0.1:8025
  mailpit:
    image: axllent/mailpit:v1.31.2
    restart: unless-stopped
    ports: ["127.0.0.1:8025:8025"]
    networks: [clearsky]

  # Traces: services → collector (OTLP) → Jaeger (http://127.0.0.1:16686).
  # See docs/observability.md.
  otel-collector:
    image: otel/opentelemetry-collector:0.161.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on: [jaeger]
    networks: [clearsky]

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    restart: unless-stopped
    ports: ["127.0.0.1:16686:16686"]
    networks: [clearsky]

networks:
  clearsky:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  rabbitmq_data:
  identity_db:
  institutions_db:
  grades_ingest_db:
  grades_query_db:
  reviews_db:
  notifications_db:
  backups:
