version: '3.8'

services:
  orchestrator:
    build:
      context: ./orchestrator
    ports:
      - "8080:8080"          # expose το 8080
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - JWT_ISSUER=${JWT_ISSUER:-clearsky-identity}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-clearsky-api}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
    networks:
      - saas-network

  frontend:
    build:
      context: ./front-end
    ports:
      - "3000:3000"
    environment:
      - GO_API_URL=http://orchestrator:8080
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
    depends_on:
      - orchestrator
    networks:
      - saas-network

networks:
  saas-network:
    driver: bridge