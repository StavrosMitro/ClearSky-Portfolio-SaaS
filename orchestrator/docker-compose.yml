version: "3.9"
services:
  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  orchestrator:
    build: .
    restart: always
    environment:
      CONFIG_PATH: configs/config.dev.yaml
      AMQP_URL: amqp://admin:admin@rabbitmq:5672/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ISSUER: ${JWT_ISSUER:-clearsky-identity}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-clearsky-api}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      RABBITMQ_MAX_IN_FLIGHT: ${RABBITMQ_MAX_IN_FLIGHT:-64}
      RABBITMQ_REQUEST_TIMEOUT: ${RABBITMQ_REQUEST_TIMEOUT:-10s}
    depends_on:
      rabbitmq:
        condition: service_healthy
