version: '3.8'
services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  auth-service:
    build: .
    container_name: auth-service
    # Internal only: the orchestrator is the public API boundary.
    expose:
      - "8082"
    depends_on:
      - rabbitmq
    entrypoint: ["/bin/sh", "-c", "./wait-for-it.sh rabbitmq:5672 -- ./user_management_service"]
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - JWT_ISSUER=${JWT_ISSUER:-clearsky-identity}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-clearsky-api}
      - INTERNAL_AUTH_TOKEN=${INTERNAL_AUTH_TOKEN:?INTERNAL_AUTH_TOKEN must be set}
      - BOOTSTRAP_ADMIN_USERNAME=${BOOTSTRAP_ADMIN_USERNAME:-}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}
